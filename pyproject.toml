[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-coding-slm"
version = "0.1.0"
description = "stdio MCP bridge from premium agents to a private Ollama SLM"
requires-python = ">=3.10"
dependencies = ["mcp>=1.9.0,<2"]

[project.optional-dependencies]
dev = ["ruff>=0.11", "lizard==1.24.0", "vulture>=2.14"]

[project.scripts]
local-coding-slm = "local_coding_slm.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["F401", "F811"]

# mutmut on the harness module only. Survivors fail the CI job.
# There is no survived ceiling to raise.
[tool.mutmut]
source_paths = ["src"]
only_mutate = ["src/local_coding_slm/eval/harness.py"]
pytest_add_cli_args_test_selection = ["tests/test_harness_mutation.py"]
use_git_change_detection = false
mutate_only_covered_lines = true
